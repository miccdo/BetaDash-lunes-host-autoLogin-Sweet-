name: Keep GitHub Actions Alive

on:
  schedule:
    # 每周一 UTC 00:00（约北京时间/韩国时间早上 8/9 点）自动运行一次
    - cron: '0 0 * * 1'
  workflow_dispatch: # 允许手动触发

jobs:
  keepalive:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 赋予提交代码的权限
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prevent Actions Suspended
        run: |
          echo "Last keepalive trigger: $(date -u)" > .keepalive
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .keepalive
          git commit -m "chore: keep github actions alive [skip ci]" || exit 0
          git push
