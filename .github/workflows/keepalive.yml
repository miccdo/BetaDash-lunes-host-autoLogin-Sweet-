name: Keep GitHub Actions Alive

on:
  schedule:
    - cron: '0 0 * * *'   # 每天检查一次
  workflow_dispatch:

jobs:
  keepalive:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 拉取完整历史，确保文件时间戳/日志准确

      - name: Decide whether to run
        id: decide
        run: |
          if [ ! -f .keepalive ]; then
            echo "首次运行，执行保活"
            echo "should_run=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          # 直接读取文件内保存的上次时间戳（时间戳格式为 UTC 秒数）
          LAST_RUN=$(cat .keepalive_timestamp 2>/dev/null || echo 0)
          NOW=$(date +%s)
          
          if [ "$LAST_RUN" -eq 0 ]; then
            DAYS_PASSED=999
          else
            DAYS_PASSED=$(( (NOW - LAST_RUN) / 86400 ))
          fi

          echo "距离上次保活已经过去 ${DAYS_PASSED} 天"

          # 3天内强制跳过（冷却期）
          if [ $DAYS_PASSED -lt 3 ]; then
            echo "还在冷却期内，跳过"
            echo "should_run=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          # 超过6天强制执行
          if [ $DAYS_PASSED -ge 6 ]; then
            echo "已经超过6天，强制执行"
            echo "should_run=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          # 3~6天之间，随机决定（大约40%概率）
          if [ $((RANDOM % 5)) -lt 2 ]; then
            echo "随机命中，执行保活"
            echo "should_run=true" >> $GITHUB_OUTPUT
          else
            echo "随机跳过"
            echo "should_run=false" >> $GITHUB_OUTPUT
          fi

      - name: Prevent Actions Suspended
        if: steps.decide.outputs.should_run == 'true'
        run: |
          # 同时记录可读时间和时间戳
          echo "Last keepalive trigger: $(date -u)" > .keepalive
          date +%s > .keepalive_timestamp

          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .keepalive .keepalive_timestamp
          git commit -m "chore: keep github actions alive [skip ci]" || exit 0
          git pull --rebase
          git push
